<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סתם סת"ם - הרשמה</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: var(--spacing-xl);
        }
        .login-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--spacing-2xl);
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }
        .login-header { text-align: center; margin-bottom: var(--spacing-2xl); }
        .login-icon { font-size: 4rem; margin-bottom: var(--spacing-md); }
        .login-title {
            font-size: 2rem; font-weight: 700;
            background: var(--bg-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: var(--spacing-sm);
        }
        .login-subtitle { color: var(--text-secondary); font-size: 1.1rem; }
        .login-form { margin-top: var(--spacing-xl); }
        .form-group { margin-bottom: var(--spacing-lg); }
        .form-label {
            display: block; font-size: 1rem; font-weight: 600;
            color: var(--text-primary); margin-bottom: var(--spacing-sm); text-align: right;
        }
        .form-input {
            width: 100%; padding: var(--spacing-md); font-size: 1rem;
            border: 2px solid var(--bg-secondary); border-radius: var(--border-radius-md);
            background: var(--bg-primary); color: var(--text-primary);
            transition: all var(--transition-base); text-align: right;
            direction: rtl; box-sizing: border-box;
        }
        .form-input.ltr { direction: ltr; text-align: left; }
        .form-input:focus {
            outline: none; border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .login-btn {
            width: 100%; padding: var(--spacing-md); font-size: 1.1rem; font-weight: 600;
            background: var(--bg-gradient); color: white; border: none;
            border-radius: var(--border-radius-lg); cursor: pointer;
            transition: all var(--transition-base); box-shadow: var(--shadow-lg);
            margin-top: var(--spacing-lg);
        }
        .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-xl); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message, .success-message {
            font-size: 0.9rem; margin-top: var(--spacing-sm); text-align: right; display: none;
        }
        .error-message { color: var(--color-error); }
        .success-message { color: var(--color-success, #2e7d32); }
        .error-message.show, .success-message.show { display: block; animation: fadeInUp 0.4s ease-out; }
        .auth-link { text-align: center; margin-top: var(--spacing-lg); color: var(--text-secondary); }
        .auth-link a { color: var(--color-primary); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📜</div>
                <h1 class="login-title">StamStam</h1>
                <p class="login-subtitle">הרשמה למערכת</p>
            </div>

            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <label for="fullNameInput" class="form-label">שם מלא:</label>
                    <input type="text" id="fullNameInput" class="form-input" placeholder="הכנס את שמך המלא" required minlength="2" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="emailInput" class="form-label">אימייל:</label>
                    <input type="email" id="emailInput" class="form-input ltr" placeholder="your@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="passwordInput" class="form-label">סיסמה:</label>
                    <input type="password" id="passwordInput" class="form-input ltr" placeholder="לפחות 6 תווים" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="phoneInput" class="form-label">טלפון (אופציונלי):</label>
                    <input type="tel" id="phoneInput" class="form-input ltr" placeholder="050-0000000" autocomplete="tel">
                </div>
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
                <button type="submit" class="login-btn" id="registerBtn">הרשמה</button>
            </form>
            <p class="auth-link">כבר רשום? <a href="login.html">התחברות</a></p>
        </div>
    </div>
    <script type="module" src="js/register.js"></script>
</body>
</html>
