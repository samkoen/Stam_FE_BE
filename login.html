<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סתם סת"ם - התחברות</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: var(--spacing-xl);
        }
        
        .login-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--spacing-2xl);
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }
        
        .login-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }
        
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .login-form {
            margin-top: var(--spacing-xl);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            text-align: right;
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-md);
            font-size: 1rem;
            border: 2px solid var(--bg-secondary);
            border-radius: var(--border-radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-base);
            text-align: right;
            direction: rtl;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
            text-align: right;
        }
        
        .login-btn {
            width: 100%;
            padding: var(--spacing-md);
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--bg-gradient);
            color: white;
            border: none;
            border-radius: var(--border-radius-lg);
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-lg);
            margin-top: var(--spacing-lg);
        }
        
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            color: var(--color-error);
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: right;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: shake 0.5s ease-out;
        }

        .success-message {
            color: var(--color-success, #2e7d32);
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: right;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .resend-wrap {
            margin-top: var(--spacing-md);
            text-align: center;
            display: none;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--color-primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: underline;
        }

        .login-footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .login-footer-links a,
        .support-link-btn {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
            padding: 0;
        }

        .support-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .support-overlay.show {
            display: flex;
        }

        .support-modal {
            background: var(--bg-primary);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--spacing-xl);
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .support-modal h2 {
            margin: 0 0 var(--spacing-md);
            font-size: 1.25rem;
            text-align: center;
            color: var(--text-primary);
        }

        .support-modal .form-textarea {
            width: 100%;
            min-height: 120px;
            padding: var(--spacing-md);
            font-size: 1rem;
            border: 2px solid var(--bg-secondary);
            border-radius: var(--border-radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            resize: vertical;
            box-sizing: border-box;
            text-align: right;
            direction: rtl;
            font-family: inherit;
        }

        .support-modal .form-textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .support-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .support-actions .login-btn {
            margin-top: 0;
            flex: 1;
        }

        .support-btn-secondary {
            flex: 1;
            padding: var(--spacing-md);
            font-size: 1rem;
            font-weight: 600;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: none;
            border-radius: var(--border-radius-lg);
            cursor: pointer;
        }

        .support-status {
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: right;
            display: none;
        }

        .support-status.show { display: block; }
        .support-status.error { color: var(--color-error); }
        .support-status.success { color: var(--color-success, #2e7d32); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📜</div>
                <h1 class="login-title">StamStam</h1>
                <p class="login-subtitle">התחברות למערכת</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="emailInput" class="form-label">אימייל:</label>
                    <input 
                        type="email" 
                        id="emailInput" 
                        class="form-input" 
                        placeholder="הכנס את האימייל שלך" 
                        required
                        autocomplete="email"
                        style="direction: ltr; text-align: left;"
                    >
                </div>
                <div class="form-group">
                    <label for="passwordInput" class="form-label">סיסמה:</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        class="form-input" 
                        placeholder="הכנס את הסיסמה שלך" 
                        required
                        autocomplete="current-password"
                        style="direction: ltr; text-align: left;"
                    >
                    <div class="error-message" id="errorMessage"></div>
                    <div class="success-message" id="successMessage"></div>
                    <div class="resend-wrap" id="resendWrap">
                        <button type="button" class="resend-btn" id="resendBtn">שלח שוב אימייל אימות</button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    התחבר
                </button>
            </form>
            <div class="login-footer-links">
                <span>אין לך חשבון? <a href="register.html">הרשמה</a></span>
                <span>·</span>
                <button type="button" class="support-link-btn" id="openSupportBtn">תמיכה</button>
            </div>
        </div>
    </div>

    <div class="support-overlay" id="supportOverlay" aria-hidden="true">
        <div class="support-modal" role="dialog" aria-labelledby="supportTitle">
            <h2 id="supportTitle">פנייה לתמיכה</h2>
            <p style="margin:0 0 var(--spacing-md);color:var(--text-secondary);font-size:0.95rem;text-align:right;">
                ההודעה נשלחת לצוות התמיכה. נשתמש באימייל שלך כדי לחזור אליך.
            </p>
            <div class="form-group">
                <label for="supportEmailInput" class="form-label">האימייל שלך (למענה):</label>
                <input type="email" id="supportEmailInput" class="form-input"
                    placeholder="your@email.com" required autocomplete="email"
                    style="direction: ltr; text-align: left;">
            </div>
            <div class="form-group">
                <label for="supportPhoneInput" class="form-label">טלפון (אופציונלי):</label>
                <input type="tel" id="supportPhoneInput" class="form-input"
                    placeholder="050-0000000" autocomplete="tel"
                    style="direction: ltr; text-align: left;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label for="supportMessageInput" class="form-label">הודעה:</label>
                <textarea id="supportMessageInput" class="form-textarea"
                    placeholder="תאר את הבעיה..." minlength="10" maxlength="2000" required></textarea>
            </div>
            <div class="support-status" id="supportStatus"></div>
            <div class="support-actions">
                <button type="button" class="support-btn-secondary" id="closeSupportBtn">ביטול</button>
                <button type="button" class="login-btn" id="sendSupportBtn">שלח</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="js/login.js"></script>
</body>
</html>
