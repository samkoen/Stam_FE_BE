<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סתם סת"ם - התחברות</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: var(--spacing-xl);
        }
        
        .login-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--spacing-2xl);
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }
        
        .login-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }
        
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .login-form {
            margin-top: var(--spacing-xl);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            text-align: right;
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-md);
            font-size: 1rem;
            border: 2px solid var(--bg-secondary);
            border-radius: var(--border-radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-base);
            text-align: right;
            direction: rtl;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
            text-align: right;
        }
        
        .login-btn {
            width: 100%;
            padding: var(--spacing-md);
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--bg-gradient);
            color: white;
            border: none;
            border-radius: var(--border-radius-lg);
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-lg);
            margin-top: var(--spacing-lg);
        }
        
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            color: var(--color-error);
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: right;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: shake 0.5s ease-out;
        }

        .success-message {
            color: var(--color-success, #2e7d32);
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: right;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .resend-wrap {
            margin-top: var(--spacing-md);
            text-align: center;
            display: none;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--color-primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📜</div>
                <h1 class="login-title">StamStam</h1>
                <p class="login-subtitle">התחברות למערכת</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="emailInput" class="form-label">אימייל:</label>
                    <input 
                        type="email" 
                        id="emailInput" 
                        class="form-input" 
                        placeholder="הכנס את האימייל שלך" 
                        required
                        autocomplete="email"
                        style="direction: ltr; text-align: left;"
                    >
                </div>
                <div class="form-group">
                    <label for="passwordInput" class="form-label">סיסמה:</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        class="form-input" 
                        placeholder="הכנס את הסיסמה שלך" 
                        required
                        autocomplete="current-password"
                        style="direction: ltr; text-align: left;"
                    >
                    <div class="error-message" id="errorMessage"></div>
                    <div class="success-message" id="successMessage"></div>
                    <div class="resend-wrap" id="resendWrap">
                        <button type="button" class="resend-btn" id="resendBtn">שלח שוב אימייל אימות</button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    התחבר
                </button>
            </form>
            <p style="text-align:center;margin-top:var(--spacing-lg);color:var(--text-secondary);">
                אין לך חשבון? <a href="register.html" style="color:var(--color-primary);font-weight:600;text-decoration:none;">הרשמה</a>
            </p>
        </div>
    </div>
    
    <script type="module" src="js/login.js"></script>
</body>
</html>
